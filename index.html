<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flow Wear</title>
<meta name="description" content="Flow Wear clothing store. Order online with delivery across Bangladesh.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff; --text: #111111; --muted: #666666;
    --accent: #111111; --card: #f4f5f7; --line: #e3e5e9;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0d10; --text: #f2f2f2; --muted: #a0a4ab;
      --accent: #ffffff; --card: #181a1f; --line: #2a2d34;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    padding-top: env(safe-area-inset-top, 0px);
  }
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 18px; background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
  .brand img { width: 44px; height: 44px; border-radius: 50%; }
  .brand span { font-weight: 800; letter-spacing: 1px; }
  nav { display: flex; align-items: center; gap: 10px; }
  nav a { color: var(--text); text-decoration: none; font-size: 0.92rem; }
  .cart-btn { background: var(--accent); color: var(--bg) !important; padding: 8px 14px; border-radius: 999px; font-weight: 600; }
  .lang-btn {
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    padding: 7px 12px; border-radius: 999px; font: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }

  /* Language popup */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal {
    background: var(--bg); color: var(--text); border-radius: 18px; padding: 28px 24px;
    width: 100%; max-width: 360px; text-align: center;
  }
  .modal .logo-big { width: 84px; height: 84px; border-radius: 50%; margin-bottom: 12px; }
  .modal h2 { font-size: 1.4rem; margin-bottom: 4px; }
  .modal p { color: var(--muted); margin-bottom: 20px; }
  .modal .lang-choice { display: grid; gap: 12px; }
  .modal .lang-choice button {
    background: var(--accent); color: var(--bg); border: none; padding: 15px; border-radius: 12px;
    font: inherit; font-size: 1.05rem; font-weight: 700; cursor: pointer;
  }

  .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.75), rgba(0,0,0,.2)); }
  .hero-inner { position: relative; padding: 40px 24px; max-width: 620px; }
  .hero h1 { font-size: clamp(2.2rem, 8vw, 3.8rem); line-height: 1.15; margin-bottom: 14px; }
  .hero p { font-size: 1.1rem; opacity: .9; margin-bottom: 24px; }
  .btn {
    display: inline-block; background: #fff; color: #000; border: none; cursor: pointer;
    padding: 13px 26px; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 1rem;
  }
  section { padding: 52px 22px; max-width: 1040px; margin: 0 auto; }
  section h2 { font-size: 1.8rem; margin-bottom: 6px; }
  .subtitle { color: var(--muted); margin-bottom: 26px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
  .card {
    background: var(--card); border-radius: 16px; padding: 16px; display: flex; flex-direction: column;
    text-decoration: none; color: var(--text); transition: transform .15s;
  }
  .card:hover { transform: translateY(-2px); }
  .thumb {
    height: 170px; border-radius: 12px; margin-bottom: 12px; overflow: hidden;
    background: linear-gradient(135deg, #2b2f38, #0b0c0f);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card h3 { font-size: 1.05rem; }
  .price { font-weight: 700; margin: 4px 0; }
  .sizes-note { font-size: 0.85rem; color: var(--muted); }
  .view-link { margin-top: 10px; font-weight: 600; font-size: 0.9rem; }

  .back { color: var(--muted); text-decoration: none; display: inline-block; margin-bottom: 18px; }
  .pd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
  .pd-media .thumb { height: 460px; margin: 0; }
  .pd-info h1 { font-size: 2rem; line-height: 1.25; margin-bottom: 8px; }
  .price.big { font-size: 1.5rem; margin-bottom: 14px; }
  .desc { color: var(--muted); margin-bottom: 22px; }
  .pd-info h3 { font-size: 1rem; margin-bottom: 10px; }
  .sizes { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .size-btn {
    min-width: 56px; padding: 11px 16px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-weight: 600;
  }
  .size-btn.selected { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 0.88rem; margin-bottom: 20px; }
  .qty-row { display: flex; align-items: center; gap: 10px; }
  .qty-row button {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 1.1rem; cursor: pointer;
  }
  .qty-row .count { min-width: 24px; text-align: center; font-weight: 600; }
  .add-btn {
    margin-top: 22px; width: 100%; background: var(--accent); color: var(--bg); border: none;
    padding: 15px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer;
  }

  .cart-box, .checkout { background: var(--card); border-radius: 16px; padding: 22px; }
  .cart-line { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .cart-line .top { display: flex; justify-content: space-between; gap: 8px; }
  .cart-line .ctrl { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 0.9rem; flex-wrap: wrap; }
  .cart-line .ctrl button {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer;
  }
  .cart-line .ctrl .remove { margin-left: auto; width: auto; border-radius: 8px; padding: 0 10px; font-size: 0.8rem; }
  .total { font-size: 1.1rem; font-weight: 700; margin-top: 14px; display: flex; justify-content: space-between; }
  .checkout-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

  form { display: grid; gap: 12px; margin-top: 12px; }
  label { font-size: 0.9rem; color: var(--muted); display: grid; gap: 6px; }
  input, textarea, select {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%;
  }
  textarea { resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .zone-box {
    border: 1px dashed var(--line); border-radius: 10px; padding: 12px; font-size: 0.92rem; color: var(--muted);
  }
  .zone-box.set { border-style: solid; color: var(--text); }
  .zone-box strong { color: var(--text); }

  .summary { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 6px; }
  .summary h4 { font-size: 1rem; margin-bottom: 8px; }
  .sum-item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .sum-item .mini { width: 52px; height: 52px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: linear-gradient(135deg, #2b2f38, #0b0c0f); }
  .sum-item .mini img { width: 100%; height: 100%; object-fit: cover; }
  .sum-item .info { flex: 1; font-size: 0.9rem; }
  .sum-item .info small { color: var(--muted); display: block; }
  .sum-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 0.95rem; }
  .sum-row.grand { font-size: 1.15rem; font-weight: 800; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }

  .submit { background: var(--accent); color: var(--bg); border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 6px; }
  .submit:disabled { opacity: .5; cursor: not-allowed; }
  .msg { padding: 12px; border-radius: 10px; margin-top: 8px; }
  .msg.ok { background: #e7f8ec; color: #135c27; }
  .msg.err { background: #fdecec; color: #8a1c1c; }
  .msg a { color: inherit; font-weight: 700; }

  .about p { max-width: 640px; color: var(--muted); }
  footer { text-align: center; padding: 30px 20px calc(30px + env(safe-area-inset-bottom, 0px)); color: var(--muted); border-top: 1px solid var(--line); font-size: 0.9rem; }
  footer a { color: var(--text); }

  .hidden { display: none !important; }
  @media (max-width: 720px) {
    .pd-grid { grid-template-columns: 1fr; gap: 20px; }
    .pd-media .thumb { height: 340px; }
  }
  @media (max-width: 600px) {
    nav { gap: 6px; }
    nav a { font-size: 0.82rem; }
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>

  const pn = p => p.name[lang];
  const pd = p => p.description[lang];
  const sizeName = s => (s === "One Size" ? t("oneSize") : s);
  const zoneOf = area => ZONES[area.zone];

  const cart = {};        // key "productId|size" -> quantity
  let pState = { size: null, qty: 1 };

  function thumbHTML(p) {
    return p.image
      ? `<div class="thumb"><img src="${p.image}" alt="${pn(p)}"></div>`
      : `<div class="thumb"></div>`;
  }

  // ----- Shop list -----
  function renderProducts() {
    document.getElementById("products").innerHTML = PRODUCTS.map(p => `
      <a class="card" href="#product-${p.id}">
        ${thumbHTML(p)}
        <h3>${pn(p)}</h3>
        <p class="price">${money(p.price)}</p>
        <p class="sizes-note">${t("sizes")} ${p.sizes.map(sizeName).join(", ")}</p>
        <span class="view-link">${t("viewChoose")}</span>
      </a>`).join("");
  }

  // ----- Product page -----
  function renderProductPage(p) {
    pState = { size: null, qty: 1 };
    document.getElementById("product-content").innerHTML = `
      <a href="#shop-list" class="back">${t("back")}</a>
      <div class="pd-grid">
        <div class="pd-media">${thumbHTML(p)}</div>
        <div class="pd-info">
          <h1>${pn(p)}</h1>
          <p class="price big">${money(p.price)}</p>
          <p class="desc">${pd(p)}</p>
          <h3>${t("selectSize")}</h3>
          <div class="sizes" id="sizes">
            ${p.sizes.map(s => `<button type="button" class="size-btn" data-size="${s}">${sizeName(s)}</button>`).join("")}
          </div>
          <p class="hint" id="sizeHint">${t("chooseSize")}</p>
          <h3>${t("quantity")}</h3>
          <div class="qty-row" style="margin-bottom:6px;">
            <button type="button" id="qMinus" aria-label="-">−</button>
            <span class="count" id="qCount">1</span>
            <button type="button" id="qPlus" aria-label="+">+</button>
          </div>
          <button class="add-btn" id="addBtn" type="button">${t("addToCart")}</button>
          <div id="pmsg"></div>
        </div>
      </div>`;

    document.getElementById("sizes").addEventListener("click", e => {
      const btn = e.target.closest(".size-btn");
      if (!btn) return;
      pState.size = btn.dataset.size;
      document.querySelectorAll(".size-btn").forEach(b => b.classList.toggle("selected", b === btn));
      document.getElementById("sizeHint").textContent = t("selectedSize") + " " + sizeName(pState.size);
      document.getElementById("pmsg").innerHTML = "";
    });
    document.getElementById("qMinus").onclick = () => {
      pState.qty = Math.max(1, pState.qty - 1);
      document.getElementById("qCount").textContent = pState.qty;
    };
    document.getElementById("qPlus").onclick = () => {
      pState.qty += 1;
      document.getElementById("qCount").textContent = pState.qty;
    };
    document.getElementById("addBtn").onclick = () => {
      const msg = document.getElementById("pmsg");
      if (!pState.size) {
        msg.innerHTML = `<div class="msg err">${t("chooseFirst")}</div>`;
        return;
      }
      const key = p.id + "|" + pState.size;
      cart[key] = (cart[key] || 0) + pState.qty;
      renderCart();
      msg.innerHTML = `<div class="msg ok">${t("added", { quantity: pState.qty, product: pn(p), size: sizeName(pState.size) })} <a href="#checkout">${t("goCheckout")}</a></div>`;
    };
  }

  // Redraw the product page in the new language, keeping the chosen size and quantity
  function refreshProductPage(p) {
    const saved = { ...pState };
    renderProductPage(p);
    pState = saved;
    if (pState.size) {
      document.querySelectorAll(".size-btn").forEach(b => b.classList.toggle("selected", b.dataset.size === pState.size));
      document.getElementById("sizeHint").textContent = t("selectedSize") + " " + sizeName(pState.size);
    }
    document.getElementById("qCount").textContent = pState.qty;
  }

  // ----- Cart -----
  function changeCart(key, delta) {
    cart[key] = (cart[key] || 0) + delta;
    if (cart[key] <= 0) delete cart[key];
    renderCart();
  }
  function removeCart(key) {
    delete cart[key];
    renderCart();
  }
  function cartItems() {
    return Object.keys(cart).map(key => {
      const [id, size] = key.split("|");
      return { key, p: findProduct(id), size, quantity: cart[key] };
    });
  }
  function cartSubtotal() {
    return cartItems().reduce((s, i) => s + i.p.price * i.quantity, 0);
  }

  function renderCart() {
    const items = cartItems();
    const linesBox = document.getElementById("cartLines");
    let count = 0;
    if (!items.length) {
      linesBox.innerHTML = `<p class="subtitle">${t("cartEmpty")}</p>`;
    } else {
      linesBox.innerHTML = items.map(i => {
        count += i.quantity;
        return `
          <div class="cart-line">
            <div class="top"><strong>${pn(i.p)}</strong><span>${money(i.p.price * i.quantity)}</span></div>
            <div class="ctrl">
              ${t("size")} ${sizeName(i.size)} &nbsp;
              <button type="button" onclick="changeCart('${i.key}', -1)">−</button>
              <span>${i.quantity}</span>
              <button type="button" onclick="changeCart('${i.key}', 1)">+</button>
              <button type="button" class="remove" onclick="removeCart('${i.key}')">${t("remove")}</button>
            </div>
          </div>`;
      }).join("");
    }
    document.getElementById("cartTotal").textContent = money(cartSubtotal());
    document.getElementById("cartCount").textContent = count;
    renderSummary();
  }

  // ----- Location dropdowns (each depends on the one before) -----
  function fillSelect(sel, items, placeholderKey) {
    const keep = sel.value;
    sel.innerHTML =
      `<option value="">${t(placeholderKey)}</option>` +
      items.map(o => `<option value="${o.id}">${lbl(o)}</option>`).join("");
    if (items.some(o => o.id === keep)) sel.value = keep;
  }

  function refreshDivisionOptions() {
    fillSelect(document.getElementById("division"), DIVISIONS, "selectDivision");
  }
  function refreshDistrictOptions() {
    const div = document.getElementById("division").value;
    const list = DISTRICTS.filter(d => d.division === div);
    fillSelect(document.getElementById("district"), list, "selectDistrict");
  }
  function refreshAreaOptions() {
    const dist = document.getElementById("district").value;
    const list = AREAS.filter(a => a.district === dist);
    fillSelect(document.getElementById("area"), list, "selectArea");
  }

  function selectedArea() {
    const id = document.getElementById("area").value;
    return AREAS.find(a => a.id === id) || null;
  }

  function renderZone() {
    const box = document.getElementById("zoneBox");
    const area = selectedArea();
    if (!area) {
      box.className = "zone-box";
      box.textContent = t("deliveryChoose");
      return;
    }
    const z = zoneOf(area);
    box.className = "zone-box set";
    box.innerHTML = `${t("deliveryZone")}: <strong>${lbl(z)}</strong> — <strong>${money(z.fee)}</strong>`;
  }

  // ----- Order summary (subtotal + delivery = grand total) -----
  function renderSummary() {
    const box = document.getElementById("summary");
    const items = cartItems();
    if (!items.length) { box.innerHTML = ""; return; }

    const area = selectedArea();
    const fee = area ? zoneOf(area).fee : 0;
    const subtotal = cartSubtotal();
    const grand = subtotal + fee;

    const rows = items.map(i => `
      <div class="sum-item">
        <div class="mini">${i.p.image ? `<img src="${i.p.image}" alt="">` : ""}</div>
        <div class="info">
          <strong>${pn(i.p)}</strong>
          <small>${t("size")}: ${sizeName(i.size)} · ${t("qty")}: ${i.quantity}</small>
        </div>
        <div>${money(i.p.price * i.quantity)}</div>
      </div>`).join("");

    box.innerHTML = `
      <h4>${t("orderSummary")}</h4>
      ${rows}
      <div class="sum-row"><span>${t("subtotal")}</span><span>${money(subtotal)}</span></div>
      <div class="sum-row"><span>${t("deliveryCharge")}${area ? " (" + lbl(zoneOf(area)) + ")" : ""}</span><span>${area ? money(fee) : "—"}</span></div>
      <div class="sum-row grand"><span>${t("grandTotal")}</span><span>${money(grand)}</span></div>`;
  }

  // ----- Phone check: accepts 01XXXXXXXXX or +880 1XXXXXXXXX -----
  function normalizePhone(raw) {
    let s = (raw || "").replace(/[\s-]/g, "");
    if (s.startsWith("+880")) s = "0" + s.slice(4);
    else if (s.startsWith("880")) s = "0" + s.slice(3);
    return /^01[3-9]\d{8}$/.test(s) ? s : null;
  }

  // ----- Language -----
  function applyLang() {
    document.documentElement.lang = lang === "bn" ? "bn" : "en";
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
    document.getElementById("langBtn").textContent = t("langSwitch");
    const divisionVal = document.getElementById("division").value;
    refreshDivisionOptions();
    document.getElementById("division").value = divisionVal;
    refreshDistrictOptions();
    refreshAreaOptions();
    renderProducts();
    renderCart();
    renderZone();
    const hash = location.hash.replace("#", "");
    if (hash.startsWith("product-")) {
      const p = findProduct(hash.slice("product-".length));
      if (p) refreshProductPage(p);
    }
  }

  function chooseLanguage(code) {
    lang = code;
    document.getElementById("langModal").classList.add("hidden");
    applyLang();
  }
  document.querySelectorAll("#langModal [data-pick]").forEach(btn => {
    btn.onclick = () => chooseLanguage(btn.dataset.pick);
  });
  document.getElementById("langBtn").onclick = () => {
    lang = lang === "en" ? "bn" : "en";
    applyLang();
  };

  // Dependent dropdowns
  document.getElementById("division").addEventListener("change", () => {
    refreshDistrictOptions();
    refreshAreaOptions();
    renderZone();
    renderSummary();
  });
  document.getElementById("district").addEventListener("change", () => {
    refreshAreaOptions();
    renderZone();
    renderSummary();
  });
  document.getElementById("area").addEventListener("change", () => {
    renderZone();
    renderSummary();
  });

  // ----- Page switching (plain #name links only) -----
  function showRoute() {
    const hash = location.hash.replace("#", "");
    let view = "shop";
    if (hash.startsWith("product-")) {
      const p = findProduct(hash.slice("product-".length));
      if (p) { view = "product"; renderProductPage(p); }
    } else if (hash === "checkout") {
      view = "checkout";
    }

    document.getElementById("view-shop").classList.toggle("hidden", view !== "shop");
    document.getElementById("view-product").classList.toggle("hidden", view !== "product");
    document.getElementById("view-checkout").classList.toggle("hidden", view !== "checkout");

    if (view === "shop" && hash === "about") {
      document.getElementById("about").scrollIntoView();
    } else if (view === "shop" && hash === "shop-list") {
      document.getElementById("shop-list").scrollIntoView();
    } else {
      window.scrollTo(0, 0);
    }
  }
  window.addEventListener("hashchange", showRoute);

  // ----- Place order -----
  document.getElementById("orderForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const result = document.getElementById("result");
    const btn = document.getElementById("submitBtn");
    const f = e.target;
    const items = cartItems();

    const fail = msgKey => {
      result.innerHTML = `<div class="msg err">${t(msgKey)}</div>`;
    };

    if (!items.length) return fail("needItem");

    const name = f.name.value.trim();
    const phone = normalizePhone(f.phone.value);
    const address = f.address.value.trim();
    const area = selectedArea();

    if (!name) return fail("errName");
    if (!phone) return fail("errPhone");
    if (!f.division.value) return fail("errDivision");
    if (!f.district.value) return fail("errDistrict");
    if (!area) return fail("errArea");
    if (!address || /[\u0980-\u09FF]/.test(address)) return fail("errAddress");

    const zone = zoneOf(area);
    const subtotal = cartSubtotal();
    const order = {
      lang,
      name,
      phone,
      email: f.email.value.trim(),
      division: f.division.value,
      district: f.district.value,
      area: area.id,
      address,
      notes: f.notes.value.trim(),
      deliveryZone: area.zone,
      deliveryFee: zone.fee,
      subtotal,
      grandTotal: subtotal + zone.fee,
      items: items.map(i => ({
        id: i.p.id, name: i.p.name.en, size: i.size, price: i.p.price, quantity: i.quantity
      }))
    };

    btn.disabled = true;
    btn.textContent = t("sending");
    result.innerHTML = "";

    try {
      const res = await fetch("/.netlify/functions/order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(order)
      });
      const out = await res.json();
      if (!res.ok) throw new Error(out.error || "Order failed");
      result.innerHTML = `<div class="msg ok">${t("thankYou", { orderNo: out.orderId ? "#" + out.orderId : "" })}</div>`;
      f.reset();
      Object.keys(cart).forEach(k => delete cart[k]);
      refreshDistrictOptions();
      refreshAreaOptions();
      renderCart();
      renderZone();
    } catch (err) {
      result.innerHTML = `<div class="msg err">${t("orderFail", { reason: err.message })}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = t("placeOrder");
    }
  });

  // Start: language popup first, then the page
  refreshDivisionOptions();
  applyLang();
  showRoute();
  document.getElementById("langModal").classList.remove("hidden");
</script>

</body>
</html>
